<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUGUST FREE FIRE PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030712;
            font-family: 'Prompt', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Background */
        canvas#matrix {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }

        /* Glitch Layer overlay */
        .cyber-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 90%);
            z-index: 2;
            pointer-events: none;
        }

        /* Main Container - Center Full Width/Height on Mobile, Centered Card on PC */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 780px;
            background: rgba(10, 15, 29, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 170, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 255, 170, 0.2), inset 0 0 15px rgba(0, 255, 170, 0.1);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
        }

        /* Header Logo Section */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00ffaa;
            text-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa, 0 0 40px #00ffaa;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa; }
            to { text-shadow: 0 0 15px #00ffaa, 0 0 30px #00ffaa, 0 0 50px #00ffaa, 0 0 70px #00ffaa; }
        }

        .subtitle {
            font-size: 0.8rem;
            color: #a0aec0;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -5px;
        }

        /* Key Verification Screen */
        .key-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            gap: 15px;
        }

        .key-input-box {
            width: 100%;
            position: relative;
        }

        .key-input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffaa;
        }

        .key-input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 170, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .key-input:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .btn-verify {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffaa 0%, #00b377 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
        }

        .btn-verify:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.85rem;
            height: 20px;
            text-align: center;
        }

        /* Panel Main Screen (Hidden initially) */
        .panel-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            gap: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menu Items */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 255, 170, 0.15);
            padding: 14px 16px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .menu-item.active {
            border-color: rgba(0, 255, 170, 0.6);
            background: rgba(0, 255, 170, 0.08);
        }

        .menu-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: rgba(0, 255, 170, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ffaa;
            font-size: 1.1rem;
        }

        .menu-text {
            display: flex;
            flex-direction: column;
        }

        .menu-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .menu-badge {
            font-size: 0.75rem;
            color: #00ffaa;
            font-family: 'Orbitron', sans-serif;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1e293b;
            transition: .4s;
            border-radius: 34px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #94a3b8;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(0, 255, 170, 0.2);
            border-color: #00ffaa;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* Terminal Console */
        .console-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 10px;
            padding: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: #00ffaa;
            height: 90px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .console-line {
            line-height: 1.3;
        }

        /* Launch Game Button */
        .btn-launch {
            margin-top: auto;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }

        .btn-launch:active {
            transform: scale(0.97);
        }

        /* Status Badge */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ffaa;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #00ffaa;
        }
    </style>
</head>
<body>

    <!-- Matrix Hacker Background Canvas -->
    <canvas id="matrix"></canvas>

    <!-- Glitch Filter Layer -->
    <div class="cyber-overlay"></div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Branding -->
        <div class="header">
            <div class="brand-name">AUGUST</div>
            <div class="subtitle">FREE FIRE INJECTOR v1.8</div>
        </div>

        <!-- Section 1: Key Input Screen -->
        <div class="key-screen" id="keyScreen">
            <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: #00ffaa; margin-bottom: 10px;"></i>
            <p style="font-size: 0.9rem; color: #a0aec0;">กรุณาใส่คีย์เพื่อเข้าสู่ระบบ</p>
            
            <div class="key-input-box">
                <i class="fa-solid fa-key"></i>
                <input type="text" id="keyInput" class="key-input" placeholder="ENTER KEY..." autocomplete="off">
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <button class="btn-verify" onclick="verifyKey()">
                <i class="fa-solid fa-unlock"></i> เข้าสู่ระบบ
            </button>
        </div>

        <!-- Section 2: Function Menu Screen (Hidden initially) -->
        <div class="panel-screen" id="panelScreen">
            
            <div class="status-header">
                <span>STATUS: <span style="color:#00ffaa;">CONNECTED</span></span>
                <span><span class="dot"></span> READY</span>
            </div>

            <div class="menu-list">
                <!-- Menu Item 1 -->
                <div class="menu-item" id="item-head">
                    <div class="menu-info">
                        <div class="menu-icon"><i class="fa-solid fa-crosshairs"></i></div>
                        <div class="menu-text">
                            <span class="menu-title">ดูดหัว</span>
                            <span class="menu-badge">อัตราความแม่นยำ 89%</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleFeature('ดูดหัว 89%', this, 'item-head')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Menu Item 2 -->
                <div class="menu-item" id="item-antiban">
                    <div class="menu-info">
                        <div class="menu-icon"><i class="fa-solid fa-shield-halved"></i></div>
                        <div class="menu-text">
                            <span class="menu-title">กันแบน</span>
                            <span class="menu-badge">ความปลอดภัย 70%</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleFeature('กันแบน 70%', this, 'item-antiban')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Menu Item 3 -->
                <div class="menu-item" id="item-aim">
                    <div class="menu-info">
                        <div class="menu-icon"><i class="fa-solid fa-magnet"></i></div>
                        <div class="menu-text">
                            <span class="menu-title">ช่วยล็อก</span>
                            <span class="menu-badge">ระดับการล็อก 50%</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleFeature('ช่วยล็อก 50%', this, 'item-aim')">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Terminal Logs -->
            <div class="console-box" id="consoleBox">
                <div class="console-line">> System Initialized...</div>
                <div class="console-line">> Waiting for feature selection...</div>
            </div>

            <!-- Launch Game Button -->
            <button class="btn-launch" onclick="launchGame()">
                <i class="fa-solid fa-gamepad"></i> เข้าสู่เกมทันที
            </button>
        </div>

    </div>

    <script>
        // Matrix Rain Animation
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const alphabet = katakana + latin;

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffaa';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // Verification Logic
        const CORRECT_KEY = "FF_18";

        function verifyKey() {
            const keyInput = document.getElementById('keyInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (keyInput === CORRECT_KEY) {
                errorMsg.style.color = "#00ffaa";
                errorMsg.innerText = "คีย์ถูกต้อง! กำลังเข้าสู่ระบบ...";
                
                setTimeout(() => {
                    document.getElementById('keyScreen').style.display = 'none';
                    document.getElementById('panelScreen').style.style = 'flex';
                    document.getElementById('panelScreen').style.display = 'flex';
                    logConsole("Key Verified. Welcome AUGUST!");
                }, 800);
            } else {
                errorMsg.style.color = "#ff4757";
                errorMsg.innerText = "คีย์ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง";
            }
        }

        // Feature Toggle Logic
        function toggleFeature(featureName, checkbox, elementId) {
            const itemElement = document.getElementById(elementId);
            if (checkbox.checked) {
                itemElement.classList.add('active');
                logConsole(`[ENABLE] เปิดใช้งาน ${featureName}`);
            } else {
                itemElement.classList.remove('active');
                logConsole(`[DISABLE] ปิดใช้งาน ${featureName}`);
            }
        }

        // Log Function
        function logConsole(message) {
            const consoleBox = document.getElementById('consoleBox');
            const newLog = document.createElement('div');
            newLog.className = 'console-line';
            newLog.innerText = `> ${message}`;
            consoleBox.appendChild(newLog);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Launch Game Function
        function launchGame() {
            logConsole("Injected successfully! Launching Free Fire...");
            setTimeout(() => {
                // Scheme link for Free Fire / Intent
                window.location.href = "freefire://";
            }, 1000);
        }
    </script>
</body>
</html>
